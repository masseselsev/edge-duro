# Линтер бекенда.
#
# Включено то, что ловит настоящие дефекты: неопределённые имена, мёртвые
# импорты и переменные, f-строки без подстановок, изменяемые аргументы по
# умолчанию. Модернизация аннотаций (правила UP) и сортировка импортов (I)
# намеренно выключены -- на текущей кодовой базе они дают ~200 замечаний
# чисто стилистического характера и переписали бы файлы целиком, ничего не
# исправив по существу. Включить их можно отдельным заходом.
line-length = 140
target-version = "py313"

exclude = ["alembic/versions"]

[lint]
select = [
    "F",   # pyflakes: неопределённые имена, неиспользуемые импорты и переменные
    "E9",  # синтаксис и отступы, ломающие исполнение
    "B",   # bugbear: изменяемые аргументы по умолчанию, except без реакции и т.п.
]
ignore = [
    "B008",  # Depends(...) в аргументах по умолчанию -- идиома FastAPI
]
