server {
    listen 3333;
    server_name localhost;

    # 127.0.0.11 is docker's embedded DNS on a user-defined network. Without
    # it "backend" would be resolved once at worker startup (which is what the
    # old upstream{} block did) and cached for good: recreating the backend
    # container changes its IP, and nginx would keep knocking on a dead address
    # until it was itself restarted -- exactly how we kept getting 502s.
    # ipv6=off: the network is IPv4-only, and the parallel AAAA lookup makes
    # nginx report "unexpected DNS response".
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    location /api/ {
        # A $variable in proxy_pass is the only way to make nginx resolve the
        # host on EVERY request instead of once at startup.
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout invalid_header http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_buffering off;
    }
}
