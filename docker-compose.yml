services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-duro_image_builder}
    volumes:
      # 18+ stores the cluster in a major-version subdirectory and treats a
      # mount at the old /var/lib/postgresql/data as a legacy data location,
      # refusing to start. The mount point moves up one level accordingly.
      - pg-data:/var/lib/postgresql
    ports:
      - "5433:5432"

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    command: /app/entrypoint.sh
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:securepassword@db:5432/duro_image_builder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-q1w2e3r4}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-me-in-production}
      DURO_WORKSPACE_PATH: ${DURO_WORKSPACE_PATH:-/opt/data/duro_workspace}
    volumes:
      - ./backend:/app
      - ${DURO_HOST_DATA_PATH:-duro-workspace}:/opt/data/duro_workspace
      - /proc:/host/proc:ro
    ports:
      - "${BACKEND_PORT:-8003}:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    privileged: true
    command: /app/worker-entrypoint.sh celery -A tasks.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:securepassword@db:5432/duro_image_builder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-q1w2e3r4}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-me-in-production}
      DURO_WORKSPACE_PATH: ${DURO_WORKSPACE_PATH:-/opt/data/duro_workspace}
    volumes:
      - ./backend:/app
      - ${DURO_HOST_DATA_PATH:-duro-workspace}:/opt/data/duro_workspace
      - /proc:/host/proc:ro
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:securepassword@db:5432/duro_image_builder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-q1w2e3r4}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super-secret-key-change-me-in-production}
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: always
    ports:
      - "3333:3333"
    volumes:
      - frontend-build:/usr/share/nginx/html
    depends_on:
      - backend
    # The host /etc/resolv.conf injects "search lan"; nginx.conf resolves
    # backend through its own resolver on every request (see
    # frontend/nginx.conf), and docker DNS answers for "backend.lan" in a way
    # nginx cannot parse ("unexpected DNS response"). A dns_search of "." means
    # "no search domain at all" and drops it.
    dns_search: "."

volumes:
  # Named per PostgreSQL major on purpose. A data directory belongs to the
  # major that created it -- an 18 server refuses to start on a 15 cluster --
  # so reusing one name across an upgrade turns "docker compose up" into a
  # container that crash-loops with no obvious cause. Carrying the major in
  # the name makes the upgrade an explicit step (dump, switch, restore) and
  # leaves the previous cluster in place to roll back to.
  pg-data:
    name: edge-duro_pg-data-18
  redis-data:
    name: edge-duro_redis-data
  duro-workspace:
    name: edge-duro_workspace
  frontend-build:
    name: edge-duro_frontend-build

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1300
